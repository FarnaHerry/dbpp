# build.yml — db++ 多平台桌面 CI 与发版流水线（Linux / Windows / macOS）。
#
# 参考 Clash-Flux/.github/workflows/build.yml 适配，按 CMake >= 4.4 + C++23 模块
# （dbpp_core + import std）构建：
#   * Linux：ubuntu:24.04 容器 + clang-21 / libc++-21-dev（含重写 libc++.modules.json 路径）；
#   * Windows：MSVC + CMake 4.4.2 + Ninja；
#   * macOS：Homebrew llvm clang++ / libc++ + 生成 libc++.modules.json；
#   * 通过 cmake/FindSQLite3.cmake（DBPP_USE_VENDORED_SQLITE3=ON）直接编译 Lib-SQLite
#     内置 SQLite3，与 HuxerUI::SQLite 共用同一份 SQLite 源码，避免各平台依赖外部 sqlite3；
#   * HuxerUI 与 Lib-SQLite 源码钉在 COMMIT，分别 clone 到 third_party/{huxerui,Lib-SQLite}/（已 gitignore）。

name: build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  HUXERUI_REPO: 'https://github.com/FarnaHerry/HuxerUI.git'
  HUXERUI_COMMIT: 'ee17f64ab47fe9f49ea3e60bffd7aa7ee554e8e2'
  LIB_SQLITE_REPO: 'https://github.com/FarnaHerry/Lib-SQLite.git'
  LIB_SQLITE_COMMIT: '882665a9772cc973b1cbfb7f491913703da1d636'

jobs:
  # ------------------------------------------------------------------ Linux
  # ubuntu:24.04 容器（GLIBC <= 2.39 基线）+ apt.llvm.org clang-21/libc++-21（C++23 modules + import std），
  # 构建 x86_64 与 arm64 免安装目录 + DEB + RPM。
  build-linux:
    name: build-linux-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    container:
      image: ubuntu:24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Install container baseline
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates curl gnupg
          install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
            | gpg --dearmor --yes -o /etc/apt/keyrings/llvm.gpg
          echo 'deb [signed-by=/etc/apt/keyrings/llvm.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-21 main' \
            > /etc/apt/sources.list.d/llvm.list
          apt-get update

      - name: Check out source
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          apt-get install -y --no-install-recommends \
            clang-21 libc++-21-dev g++ ninja-build pkg-config file binutils gzip xz-utils \
            python3 python3-pip libgtk-4-dev libepoxy-dev libsoup-3.0-dev dpkg-dev rpm
          python3 -m pip install --break-system-packages -q cmake==4.4.2
          cmake --version | head -1
          clang++-21 --version | head -1
          python3 -c "
          import glob, json
          p = glob.glob('/usr/lib/*-linux-gnu/libc++.modules.json')[0]
          d = json.load(open(p))
          for m in d['modules']:
              m['source-path'] = '/usr/lib/llvm-21/share/libc++/v1/' + m['source-path'].split('/')[-1]
              m['local-arguments']['system-include-directories'] = ['/usr/lib/llvm-21/share/libc++/v1']
          json.dump(d, open(p, 'w'), indent=1)"

      - name: Install safe patchelf for runtime deployment
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.arch }}" in
            x86_64)
              patchelf_arch=x86_64
              patchelf_sha256=2abdc34fbe949c995a1baa4ec310896a085588a45a99cd0d726851bdfac2a4bb
              ;;
            arm64)
              patchelf_arch=aarch64
              patchelf_sha256=ba6850c1a6f4cbdb050e1cc22fa5239159ad31c43606846e49c408d335f594ff
              ;;
            *) exit 1 ;;
          esac
          patchelf_archive="${RUNNER_TEMP}/patchelf-0.19.2-${patchelf_arch}.tar.gz"
          patchelf_root="${RUNNER_TEMP}/dbpp-patchelf"
          curl --fail --location --retry 3 \
            "https://github.com/NixOS/patchelf/releases/download/0.19.2/patchelf-0.19.2-${patchelf_arch}.tar.gz" \
            --output "${patchelf_archive}"
          printf '%s  %s\n' "${patchelf_sha256}" "${patchelf_archive}" | sha256sum --check --status
          mkdir -p "${patchelf_root}"
          tar -xzf "${patchelf_archive}" -C "${patchelf_root}"
          printf '%s\n' "${patchelf_root}/bin" >> "${GITHUB_PATH}"
          "${patchelf_root}/bin/patchelf" --version

      - name: Fetch HuxerUI & Lib-SQLite sources (pinned)
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none "$HUXERUI_REPO" third_party/huxerui
          git -C third_party/huxerui checkout "$HUXERUI_COMMIT"
          git clone --filter=blob:none "$LIB_SQLITE_REPO" third_party/Lib-SQLite
          git -C third_party/Lib-SQLite checkout "$LIB_SQLITE_COMMIT"

      - name: Configure
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DDBPP_BUILD_TESTS=ON -DDBPP_USE_VENDORED_SQLITE3=ON \
            -DCMAKE_C_COMPILER=clang-21 -DCMAKE_CXX_COMPILER=clang++-21 \
            -DCMAKE_CXX_FLAGS='-stdlib=libc++' \
            -DCMAKE_EXE_LINKER_FLAGS='-stdlib=libc++' \
            -DCMAKE_SHARED_LINKER_FLAGS='-stdlib=libc++'

      - name: Build release
        run: cmake --build build --config Release --parallel

      - name: Smoke test
        run: ctest --test-dir build --output-on-failure --no-tests=error --timeout 120

      - name: Stage runtime bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist-root dist-src
          DESTDIR="$PWD/dist-root" cmake --install build --component HuxerUIApplication --prefix /opt/dbpp
          mkdir -p dist-src/lib
          cp -a dist-root/opt/dbpp/. dist-src/
          for lib in libc++.so.1 libc++abi.so.1 libunwind.so.1; do
            if [ ! -e "dist-src/lib/$lib" ]; then
              p="$(find /usr/lib -name "$lib" -print -quit 2>/dev/null || true)"
              if [ -n "$p" ]; then cp -L "$p" "dist-src/lib/$lib"; fi
            fi
          done
          for bin in dist-src/dbpp dist-src/lib/*.so*; do
            if [ -f "$bin" ] && [ ! -L "$bin" ]; then
              chmod u+w "$bin"
              strip --strip-unneeded "$bin"
            fi
          done
          patchelf --set-rpath '$ORIGIN/lib' dist-src/dbpp
          mkdir -p dist-src/share/applications dist-src/share/icons/hicolor/256x256/apps
          cp platform/linux/dbpp.desktop dist-src/share/applications/dbpp.desktop
          cp assets/icon.png dist-src/share/icons/hicolor/256x256/apps/dbpp.png
          test -x dist-src/dbpp
          test -f dist-src/dbpp.resources/huxerui/resources.bin
          test -f dist-src/lib/libhuxerui.so
          compgen -G 'dist-src/lib/libadbc_driver_manager.so*' >/dev/null
          compgen -G 'dist-src/lib/libadbc_driver_sqlite.so*' >/dev/null
          for bin in dist-src/dbpp dist-src/lib/libadbc_driver_manager.so* dist-src/lib/libadbc_driver_sqlite.so*; do
            if [ -f "$bin" ] && ! [ -L "$bin" ]; then
              if readelf --version-info "$bin" | grep -Eq 'GLIBC_2\.(4[0-9]|[5-9][0-9])'; then
                echo "Linux binary requires newer than GLIBC_2.39: $bin" >&2
                exit 1
              fi
            fi
          done
          ls -la dist-src dist-src/lib

      - name: Package Linux archives (tar.xz, DEB, RPM)
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist-packages
          mkdir -p dist-packages
          tar_arch="${{ matrix.arch }}"
          [[ "$tar_arch" == "arm64" ]] && tar_arch="aarch64"
          tarball="dist-packages/dbpp-linux-${tar_arch}.tar.xz"
          tar_stage="$(mktemp -d)"
          trap 'rm -rf "$tar_stage"' EXIT
          mkdir -p "$tar_stage/dbpp"
          cp -a dist-src/. "$tar_stage/dbpp/"
          tar -C "$tar_stage" -cf - dbpp | xz -T0 -6 > "$tarball"

          cpack --config build/CPackConfig.cmake -G DEB -B dist-packages
          cpack --config build/CPackConfig.cmake -G RPM -B dist-packages
          packages=(dist-packages/*.deb dist-packages/*.rpm)
          test "${#packages[@]}" -eq 2

          tar_list="$(tar -tvJf "$tarball")"
          grep -Eq '^-rwx[^ ]* .* dbpp/dbpp$' <<<"$tar_list"
          for soname in libc++.so.1 libc++abi.so.1 libadbc_driver_manager.so.113; do
            if [ -L "dist-src/lib/$soname" ]; then
              awk -v target="dbpp/lib/${soname}" '$1 ~ /^l/ && $(NF-2) == target && $(NF-1) == "->" { found=1 } END { exit !found }' <<<"$tar_list"
            fi
          done

          tar_size="$(stat -c '%s' "$tarball")"
          deb_size="$(stat -c '%s' dist-packages/*.deb)"
          rpm_size="$(stat -c '%s' dist-packages/*.rpm)"
          test "$tar_size" -lt "$deb_size"
          test "$tar_size" -lt "$rpm_size"

          expected_rpm_arch="${{ matrix.arch }}"
          [[ "$expected_rpm_arch" == "arm64" ]] && expected_rpm_arch="aarch64"
          rpm_files=(dist-packages/*.rpm)
          test "${#rpm_files[@]}" -eq 1
          rpm_arch="$(rpm -qp --qf '%{ARCH}' "${rpm_files[0]}")"
          test "$rpm_arch" = "$expected_rpm_arch"
          if rpm -qpl "${rpm_files[0]}" | grep -q '/usr/lib/\.build-id/'; then
            echo "RPM must not ship global /usr/lib/.build-id/ links" >&2
            exit 1
          fi
          elf_info="$(file dist-src/dbpp)"
          if [[ "$expected_rpm_arch" == "aarch64" ]]; then
            [[ "$elf_info" == *"ARM aarch64"* ]]
          else
            [[ "$elf_info" == *"x86-64"* ]]
          fi
          ls -lh dist-packages/

      - name: Test install.sh
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/install.sh
          tar_arch="${{ matrix.arch }}"
          [[ "$tar_arch" == "arm64" ]] && tar_arch="aarch64"
          tmp_root="$(mktemp -d)"
          trap 'rm -rf "$tmp_root"' EXIT
          tmp_rel="$tmp_root/rel"
          tmp_home="$tmp_root/home"
          mkdir -p "$tmp_rel" "$tmp_home/.local/share/dbpp"
          cp "dist-packages/dbpp-linux-${tar_arch}.tar.xz" "$tmp_rel/dbpp-0.0.0-linux-${tar_arch}.tar.xz"
          (cd "$tmp_rel" && sha256sum "dbpp-0.0.0-linux-${tar_arch}.tar.xz" > SHA256SUMS.txt)
          printf 'keep-me' > "$tmp_home/.local/share/dbpp/dbpp.sqlite3"
          HOME="$tmp_home" XDG_DATA_HOME="$tmp_home/.local/share" \
            scripts/install.sh --version 0.0.0 --download-base "file://$tmp_rel" --require-checksum
          HOME="$tmp_home" XDG_DATA_HOME="$tmp_home/.local/share" \
            scripts/install.sh --version 0.0.0 --download-base "file://$tmp_rel" --require-checksum
          "$tmp_home/.local/bin/dbpp" --version
          test -f "$tmp_home/.local/share/applications/dbpp.desktop"
          test -f "$tmp_home/.local/share/icons/hicolor/256x256/apps/dbpp.png"
          test "$(cat "$tmp_home/.local/share/dbpp/dbpp.sqlite3")" = "keep-me"
          HOME="$tmp_home" XDG_DATA_HOME="$tmp_home/.local/share" \
            scripts/install.sh --uninstall
          test ! -e "$tmp_home/.local/bin/dbpp"
          test ! -e "$tmp_home/.local/opt/dbpp"
          test ! -e "$tmp_home/.local/share/applications/dbpp.desktop"
          test ! -e "$tmp_home/.local/share/icons/hicolor/256x256/apps/dbpp.png"
          test "$(cat "$tmp_home/.local/share/dbpp/dbpp.sqlite3")" = "keep-me"

          # Fallback check for legacy .tar.gz releases
          tmp_rel_gz="$tmp_root/rel-gz"
          tmp_stage_gz="$tmp_root/stage-gz"
          mkdir -p "$tmp_rel_gz" "$tmp_stage_gz/dbpp"
          cp -a dist-src/. "$tmp_stage_gz/dbpp/"
          tar -C "$tmp_stage_gz" -czf "$tmp_rel_gz/dbpp-0.0.1-linux-${tar_arch}.tar.gz" dbpp
          (cd "$tmp_rel_gz" && sha256sum "dbpp-0.0.1-linux-${tar_arch}.tar.gz" > SHA256SUMS.txt)
          HOME="$tmp_home" XDG_DATA_HOME="$tmp_home/.local/share" \
            scripts/install.sh --version 0.0.1 --download-base "file://$tmp_rel_gz" --require-checksum
          "$tmp_home/.local/bin/dbpp" --version
          HOME="$tmp_home" XDG_DATA_HOME="$tmp_home/.local/share" \
            scripts/install.sh --uninstall

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-linux-${{ matrix.arch }}
          path: dist-packages
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------- Windows
  build-windows:
    name: build-windows-x86_64
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Exclude workspace from Defender realtime scan
        shell: pwsh
        run: Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE

      - name: Fetch HuxerUI & Lib-SQLite sources (pinned)
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none "$HUXERUI_REPO" third_party/huxerui
          git -C third_party/huxerui checkout "$HUXERUI_COMMIT"
          git clone --filter=blob:none "$LIB_SQLITE_REPO" third_party/Lib-SQLite
          git -C third_party/Lib-SQLite checkout "$LIB_SQLITE_COMMIT"

      - name: Ensure CMake >= 4.4 and Ninja
        shell: pwsh
        run: |
          python -m pip install --quiet "cmake==4.4.2"
          if ($LASTEXITCODE -ne 0) { throw 'CMake installation failed' }
          cmake --version | Select-Object -First 1
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja -y --no-progress
          }
          ninja --version

      - name: Capture runner image version
        shell: pwsh
        run: |
          "IMAGE_VERSION=$env:ImageVersion" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $wixRoot = Join-Path (Get-Location) '.huxerui/package/windows/dependencies/wix'
          New-Item -ItemType Directory -Force $wixRoot | Out-Null
          dotnet --list-runtimes
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DDBPP_BUILD_TESTS=ON -DDBPP_USE_VENDORED_SQLITE3=ON `
            -DHUXERUI_PACKAGE=ON "-DHUXERUI_WIX_ROOT=$wixRoot"
          if ($LASTEXITCODE -ne 0) { throw 'cmake configure failed' }

      - name: Build release
        run: cmake --build build --config Release --parallel

      - name: Smoke test
        run: ctest --test-dir build --output-on-failure --no-tests=error --timeout 120

      - name: Stage Windows runtime and installer inputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Invoke-Native([string] $File, [string[]] $Arguments) {
            & $File @Arguments
            if ($LASTEXITCODE -ne 0) {
              throw "$File exited with code $LASTEXITCODE"
            }
          }

          $cmake = (Get-Command cmake).Path
          $projectRoot = (Get-Location).Path
          $planPath = Join-Path $projectRoot 'build/huxerui-package/windows/Release/package.json'
          if (-not (Test-Path $planPath -PathType Leaf)) {
            throw "HuxerUI Windows package plan not found: $planPath"
          }
          $plan = Get-Content $planPath -Raw | ConvertFrom-Json
          $installerPlanPath = [string]$plan.installerPlan
          if (-not (Test-Path $installerPlanPath -PathType Leaf)) {
            throw "HuxerUI installer integration plan not found: $installerPlanPath"
          }
          $installerPlan = Get-Content $installerPlanPath -Raw | ConvertFrom-Json

          $packageRoot = Join-Path $projectRoot '.huxerui/package/windows/release'
          $staging = Join-Path $packageRoot 'staging'
          $installerStaging = Join-Path $packageRoot 'installer'
          New-Item -ItemType Directory -Force $packageRoot | Out-Null
          Invoke-Native $cmake @('-E', 'rm', '-rf', $staging)
          Invoke-Native $cmake @('-E', 'rm', '-rf', $installerStaging)
          Invoke-Native $cmake @('-E', 'make_directory', $staging)
          Invoke-Native $cmake @('-E', 'make_directory', $installerStaging)

          Invoke-Native $cmake @('--install', 'build', '--config', 'Release', '--component',
            [string]$plan.installComponent, '--prefix', $staging)
          Invoke-Native $cmake @('--install', 'build', '--config', 'Release', '--component',
            [string]$installerPlan.installComponent, '--prefix', $installerStaging)

      - name: Stage executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $staging = '.huxerui/package/windows/release/staging'
          New-Item -ItemType Directory -Force dist-src | Out-Null
          Copy-Item (Join-Path $staging '*') dist-src -Recurse -Force
          foreach ($file in @('dbpp.exe', 'huxerui.dll', 'adbc_driver_manager.dll', 'adbc_driver_sqlite.dll', 'dbpp.resources/huxerui/resources.bin')) {
            if (-not (Test-Path (Join-Path 'dist-src' $file) -PathType Leaf)) {
              throw "Windows runtime payload is missing: $file"
            }
          }
          Get-Item dist-src/*

      - name: Test install.ps1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/install.ps1').Path, [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) {
            throw "install.ps1 parse errors: $($errors | Out-String)"
          }
          $tmpRoot = Join-Path $env:RUNNER_TEMP 'dbpp-install-test'
          $tmpRel = Join-Path $tmpRoot 'rel'
          $tmpInstall = Join-Path $tmpRoot 'install'
          $dataDir = Join-Path $env:LOCALAPPDATA 'dbpp\data'
          $dataMarker = Join-Path $dataDir 'dbpp.sqlite3'
          New-Item -ItemType Directory -Force $tmpRel, $dataDir | Out-Null
          try {
            Set-Content -LiteralPath $dataMarker -Value 'keep-me' -NoNewline
            $zipPath = Join-Path $tmpRel 'dbpp-0.0.0-windows-x86_64.zip'
            Compress-Archive -Path 'dist-src\*' -DestinationPath $zipPath -Force
            $hash = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
            Set-Content -LiteralPath (Join-Path $tmpRel 'SHA256SUMS.txt') -Value "$hash  dbpp-0.0.0-windows-x86_64.zip"
            & .\scripts\install.ps1 -Version 0.0.0 -DownloadBase $tmpRel -InstallDir $tmpInstall -NoModifyPath -NoShortcut -NoUninstallEntry -RequireChecksum
            & .\scripts\install.ps1 -Version 0.0.0 -DownloadBase $tmpRel -InstallDir $tmpInstall -NoModifyPath -NoShortcut -NoUninstallEntry -RequireChecksum
            $psi = New-Object System.Diagnostics.ProcessStartInfo
            $psi.FileName = Join-Path $tmpInstall 'dbpp.exe'
            $psi.Arguments = '--version'
            $psi.WorkingDirectory = $tmpInstall
            $psi.UseShellExecute = $false
            $psi.RedirectStandardOutput = $true
            $psi.RedirectStandardError = $true
            $psi.CreateNoWindow = $true
            $proc = [System.Diagnostics.Process]::Start($psi)
            $stdoutTask = $proc.StandardOutput.ReadToEndAsync()
            $stderrTask = $proc.StandardError.ReadToEndAsync()
            if (-not $proc.WaitForExit(15000)) { $proc.Kill(); throw 'dbpp.exe --version timed out' }
            $verOut = $stdoutTask.GetAwaiter().GetResult().Trim()
            $verErr = $stderrTask.GetAwaiter().GetResult().Trim()
            if ($proc.ExitCode -ne 0 -or $verOut -notmatch '^dbpp ') {
              throw ("dbpp.exe --version failed (exit {0} / 0x{1:X8}): out='{2}' err='{3}'" -f $proc.ExitCode, [int]$proc.ExitCode, $verOut, $verErr)
            }
            $proc.Dispose()
            if ((Get-Content -LiteralPath $dataMarker -Raw) -ne 'keep-me') { throw 'User data marker modified during install' }
            & .\scripts\install.ps1 -Uninstall -InstallDir $tmpInstall
            if (Test-Path -LiteralPath $tmpInstall) { throw "Install directory was not removed: $tmpInstall" }
            if ((Get-Content -LiteralPath $dataMarker -Raw) -ne 'keep-me') { throw 'User data marker modified during uninstall' }
          } finally {
            Remove-Item -LiteralPath $tmpRoot -Recurse -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $dataMarker -Force -ErrorAction SilentlyContinue
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-windows-x86_64
          path: dist-src
          if-no-files-found: error
          retention-days: 14

      - name: Upload installer inputs
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer-input
          path: |
            .huxerui/package/windows/release
            .huxerui/package/windows/dependencies
            build/huxerui-package/windows
          if-no-files-found: error
          retention-days: 2

  # -------------------------------------------------------- Windows Installer
  build-windows-installer:
    name: build-windows-installer
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows]
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Pin CMake
        shell: pwsh
        run: |
          python -m pip install --quiet "cmake==4.4.2"
          if ($LASTEXITCODE -ne 0) { throw 'CMake installation failed' }
          cmake --version | Select-Object -First 1

      - name: Fetch HuxerUI packaging script
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none "$HUXERUI_REPO" third_party/huxerui
          git -C third_party/huxerui checkout "$HUXERUI_COMMIT"

      - name: Download staged installer inputs
        uses: actions/download-artifact@v8
        with:
          name: windows-installer-input
          path: installer-input

      - name: Build installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Copy-Item 'installer-input/.huxerui' '.huxerui' -Recurse -Force
          Copy-Item 'installer-input/build' 'build' -Recurse -Force
          $projectRoot = (Get-Location).Path
          $plan = Get-Content 'build/huxerui-package/windows/Release/package.json' -Raw | ConvertFrom-Json
          $installerPlan = Get-Content ([string]$plan.installerPlan) -Raw | ConvertFrom-Json
          $packageRoot = Join-Path $projectRoot '.huxerui/package/windows/release'
          $staging = Join-Path $packageRoot 'staging'
          $installerStaging = Join-Path $packageRoot 'installer'
          $msi = Join-Path $packageRoot "$($plan.target).msi"
          $payloads = Join-Path $packageRoot 'installer-payloads.wxs'
          $bundle = Join-Path $packageRoot "$($plan.target)-Setup-$($plan.version).exe"
          $wix = [string]$installerPlan.wix
          & $wix build ([string]$plan.packageSource) '-arch' 'x64' '-bindpath' "Application=$staging" '-bindpath' "Project=$(Join-Path $projectRoot 'platform/windows')" '-out' $msi
          if ($LASTEXITCODE -ne 0) { throw 'WiX MSI build failed' }
          $cmake = (Get-Command cmake).Path
          & $cmake "-DHUXERUI_WIX_PAYLOAD_DIRECTORY=$installerStaging" "-DHUXERUI_WIX_PAYLOAD_EXECUTABLE=$([string]$installerPlan.installer)" "-DHUXERUI_WIX_PAYLOAD_OUTPUT=$payloads" '-P' (Join-Path $projectRoot 'third_party/huxerui/cmake/HuxerUIGenerateWixPayloads.cmake')
          if ($LASTEXITCODE -ne 0) { throw 'WiX payload generation failed' }
          & $wix build ([string]$plan.bundleSource) $payloads '-arch' 'x64' '-bindpath' "Installer=$installerStaging" '-bindpath' "Package=$packageRoot" '-bindpath' "Project=$(Join-Path $projectRoot 'platform/windows')" '-out' $bundle
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $bundle -PathType Leaf)) { throw 'WiX setup build failed' }
          $releaseVersion = $env:GITHUB_REF_NAME.Substring(1)
          New-Item -ItemType Directory -Force dist-src | Out-Null
          $outExe = Join-Path 'dist-src' "dbpp-$releaseVersion-windows-x86_64.exe"
          Copy-Item $bundle $outExe -Force
          if (-not (Test-Path $outExe -PathType Leaf)) {
            throw 'Staged Windows installer is missing'
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-windows-installer
          path: dist-src
          if-no-files-found: error
          retention-days: 2

  # ------------------------------------------------------------------ macOS
  build-macos:
    name: build-macos-arm64
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Select Xcode toolchain
        run: |
          set -euo pipefail
          if [ -d /Applications/Xcode_26.2.app/Contents/Developer ]; then
            dev_dir="/Applications/Xcode_26.2.app/Contents/Developer"
          else
            latest_xcode="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n 1)"
            test -n "$latest_xcode"
            dev_dir="${latest_xcode}/Contents/Developer"
          fi
          echo "DEVELOPER_DIR=$dev_dir" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$dev_dir" xcodebuild -version
          DEVELOPER_DIR="$dev_dir" xcrun clang++ --version

      - name: Fetch HuxerUI & Lib-SQLite sources (pinned)
        run: |
          set -euo pipefail
          git clone --filter=blob:none "$HUXERUI_REPO" third_party/huxerui
          git -C third_party/huxerui checkout "$HUXERUI_COMMIT"
          git clone --filter=blob:none "$LIB_SQLITE_REPO" third_party/Lib-SQLite
          git -C third_party/Lib-SQLite checkout "$LIB_SQLITE_COMMIT"

      - name: Install dependencies (brew llvm + cmake + ninja)
        run: |
          set -euo pipefail
          brew install llvm
          python3 -m venv "$RUNNER_TEMP/dbpp-tools"
          "$RUNNER_TEMP/dbpp-tools/bin/python" -m pip install -q cmake==4.4.2 ninja
          echo "$RUNNER_TEMP/dbpp-tools/bin" >> "$GITHUB_PATH"
          llvm_prefix="$(brew --prefix llvm)"
          mod_dir="$llvm_prefix/share/libc++/v1"
          for f in std.cppm std.compat.cppm; do
            test -f "$mod_dir/$f" || { echo "missing $mod_dir/$f (brew llvm layout changed?)" >&2; exit 1; }
          done
          python3 - "$mod_dir" "$llvm_prefix/lib/libc++.modules.json" <<'PY'
          import json, sys
          mod_dir, out = sys.argv[1], sys.argv[2]
          mod = lambda name: {"logical-name": name, "source-path": mod_dir + "/" + name + ".cppm", "is-std-library": True, "local-arguments": {"system-include-directories": [mod_dir]}}
          json.dump({"version": 1, "revision": 1, "modules": [mod("std"), mod("std.compat")]}, open(out, "w"), indent=1)
          PY
          echo "LLVM_PREFIX=$llvm_prefix" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/dbpp-tools/bin/cmake" --version | head -1
          "$RUNNER_TEMP/dbpp-tools/bin/ninja" --version

      - name: Configure
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DHUXERUI_PACKAGE=ON \
            -DCMAKE_C_COMPILER="$LLVM_PREFIX/bin/clang" \
            -DCMAKE_CXX_COMPILER="$LLVM_PREFIX/bin/clang++" \
            -DCMAKE_OBJCXX_COMPILER="$LLVM_PREFIX/bin/clang++" \
            -DCMAKE_CXX_FLAGS='-stdlib=libc++ -D_LIBCPP_DISABLE_AVAILABILITY' \
            -DCMAKE_OBJCXX_FLAGS='-stdlib=libc++ -D_LIBCPP_DISABLE_AVAILABILITY' \
            -DCMAKE_EXE_LINKER_FLAGS="-stdlib=libc++ -L$LLVM_PREFIX/lib/c++ -L$LLVM_PREFIX/lib/unwind -Wl,-rpath,$LLVM_PREFIX/lib/c++ -Wl,-rpath,$LLVM_PREFIX/lib/unwind -Wl,-headerpad_max_install_names -lc++ -lc++abi -lunwind" \
            -DCMAKE_SHARED_LINKER_FLAGS="-stdlib=libc++ -L$LLVM_PREFIX/lib/c++ -L$LLVM_PREFIX/lib/unwind -Wl,-rpath,$LLVM_PREFIX/lib/c++ -Wl,-rpath,$LLVM_PREFIX/lib/unwind -Wl,-headerpad_max_install_names -lc++ -lc++abi -lunwind" \
            -DCMAKE_MODULE_LINKER_FLAGS="-stdlib=libc++ -L$LLVM_PREFIX/lib/c++ -L$LLVM_PREFIX/lib/unwind -Wl,-rpath,$LLVM_PREFIX/lib/c++ -Wl,-rpath,$LLVM_PREFIX/lib/unwind -Wl,-headerpad_max_install_names -lc++ -lc++abi -lunwind" \
            -DCMAKE_CXX_STDLIB_MODULES_JSON="$LLVM_PREFIX/lib/libc++.modules.json" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DDBPP_BUILD_TESTS=ON -DDBPP_USE_VENDORED_SQLITE3=ON

      - name: Build release
        run: cmake --build build --config Release --parallel

      - name: Smoke test
        run: ctest --test-dir build --output-on-failure --no-tests=error --timeout 120

      - name: Package macOS DMG
        run: |
          set -euo pipefail
          plan_path="build/huxerui-integration/dbpp/Release/app.json"
          test -f "$plan_path"
          IFS=$'\t' read -r app_name app_target app_version install_component < <(python3 - "$plan_path" <<'PY'
          import json, sys
          plan = json.load(open(sys.argv[1]))
          print(f'{plan["name"]}\t{plan["target"]}\t{plan["version"]}\t{plan["installComponent"]}')
          PY
          )
          package_root="$PWD/.huxerui/package/macos/release"
          staging="$package_root/staging"
          dmg_path="$package_root/${app_target}-${app_version}.dmg"
          cmake -E rm -rf "$staging"
          cmake -E make_directory "$staging"
          cmake --install build --config Release --component "$install_component" --prefix "$staging"

          bundle="$staging/${app_target}.app"
          test -d "$bundle"
          test -x "$bundle/Contents/MacOS/${app_target}"
          test -f "$bundle/Contents/Resources/HuxerUI/huxerui/resources.bin"
          test -f "$bundle/Contents/Resources/AppIcon.icns"
          ls "$bundle/Contents/Frameworks"/libhuxerui*.dylib >/dev/null
          ls "$bundle/Contents/Frameworks"/libadbc_driver_manager*.dylib >/dev/null
          ls "$bundle/Contents/Frameworks"/libadbc_driver_sqlite*.dylib >/dev/null
          codesign --verify --deep --strict "$bundle"
          "$bundle/Contents/MacOS/${app_target}" --version

          cmake -E create_symlink /Applications "$staging/Applications"
          hdiutil create -volname "$app_name" -srcfolder "$staging" -format UDZO -ov "$dmg_path"
          test -s "$dmg_path"
          rm -rf dist-src
          mkdir -p dist-src
          cp "$dmg_path" dist-src/
          ls -lh dist-src/

      - name: Test install.sh
        run: |
          set -euo pipefail
          bash -n scripts/install.sh
          tmp_root="$(mktemp -d)"
          trap 'rm -rf "$tmp_root"' EXIT
          tmp_rel="$tmp_root/rel"
          mkdir -p "$tmp_rel"
          cp dist-src/*.dmg "$tmp_rel/dbpp-0.0.0-macos-arm64.dmg"
          (cd "$tmp_rel" && shasum -a 256 "dbpp-0.0.0-macos-arm64.dmg" > SHA256SUMS.txt)
          scripts/install.sh --version 0.0.0 --download-base "file://$tmp_rel" \
            --install-dir "$RUNNER_TEMP/dbpp-apps" --bin-dir "$RUNNER_TEMP/dbpp-bin" --require-checksum
          "$RUNNER_TEMP/dbpp-bin/dbpp" --version
          scripts/install.sh --install-dir "$RUNNER_TEMP/dbpp-apps" --bin-dir "$RUNNER_TEMP/dbpp-bin" --uninstall
          test ! -e "$RUNNER_TEMP/dbpp-apps/dbpp.app"
          test ! -e "$RUNNER_TEMP/dbpp-bin/dbpp"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-macos-arm64
          path: dist-src
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------- Release
  publish-release:
    name: publish-release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-windows, build-macos, build-windows-installer]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: build-*
          path: dist
          merge-multiple: false

      - name: Package release artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          release_version="${GITHUB_REF_NAME#v}"
          test "$release_version" != "$GITHUB_REF_NAME"
          for artifact in dist/build-*; do
            name="$(basename "$artifact")"
            if [ "$name" = "build-windows-x86_64" ]; then
              (
                cd "$artifact"
                zip -qr "$GITHUB_WORKSPACE/release/dbpp-${release_version}-windows-x86_64.zip" .
              )
            elif [ "$name" = "build-windows-installer" ]; then
              installer="$artifact/dbpp-${release_version}-windows-x86_64.exe"
              test -s "$installer"
              cp "$installer" "release/dbpp-${release_version}-windows-x86_64.exe"
            elif [[ "$name" == build-linux-* ]]; then
              arch="${name#build-linux-}"
              [[ "$arch" == "arm64" ]] && arch="aarch64"
              tarball="$artifact/dbpp-linux-${arch}.tar.xz"
              test -s "$tarball"
              cp "$tarball" "release/dbpp-${release_version}-linux-${arch}.tar.xz"
              shopt -s nullglob
              for extension in deb rpm; do
                packages=("$artifact"/*."$extension")
                test "${#packages[@]}" -eq 1
                cp "${packages[0]}" "release/dbpp-${release_version}-linux-${arch}.${extension}"
              done
            elif [[ "$name" == build-macos-* ]]; then
              arch="${name#build-macos-}"
              shopt -s nullglob
              dmgs=("$artifact"/*.dmg)
              test "${#dmgs[@]}" -eq 1
              test -s "${dmgs[0]}"
              cp "${dmgs[0]}" "release/dbpp-${release_version}-macos-${arch}.dmg"
            else
              echo "Unsupported build artifact: $name" >&2
              exit 1
            fi
          done
          cp scripts/install.sh release/install.sh
          cp scripts/install.ps1 release/install.ps1
          (
            cd release
            LC_ALL=C sha256sum dbpp-* install.sh install.ps1 | sort -k2 > SHA256SUMS.txt
          )
          test -s "release/dbpp-${release_version}-windows-x86_64.zip"
          test -s "release/dbpp-${release_version}-windows-x86_64.exe"
          test -s "release/dbpp-${release_version}-macos-arm64.dmg"
          test -s "release/install.sh"
          test -s "release/install.ps1"
          test -s "release/SHA256SUMS.txt"
          for arch in x86_64 aarch64; do
            test -s "release/dbpp-${release_version}-linux-${arch}.tar.xz"
            test -s "release/dbpp-${release_version}-linux-${arch}.deb"
            test -s "release/dbpp-${release_version}-linux-${arch}.rpm"
          done
          ls -lh release

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/$GITHUB_REF_NAME.md"
          if [ -f "$notes" ]; then
            note_args=(--notes-file "$notes")
          else
            note_args=(--generate-notes)
          fi
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber release/*
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "db++ $GITHUB_REF_NAME" \
              "${note_args[@]}" \
              release/*
          fi
